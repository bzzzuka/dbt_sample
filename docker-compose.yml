services:

  postgres:
    image: docker.m.daocloud.io/library/postgres:15-alpine
    container_name: dbt_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20
    networks:
      - dbt_network

  minio:
    image: ghcr.io/coollabsio/minio:latest
    container_name: dbt_minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 3s
      timeout: 3s
      retries: 20
    networks:
      - dbt_network

  # Одноразовый контейнер: генерация данных → S3 → Postgres
  data-init:
    build:
      context: ./dbt
      dockerfile: Dockerfile
    container_name: dbt_data_init
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_DB: ${POSTGRES_DB}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET}
      MINIO_REGION: ${MINIO_REGION}
      LAYER: ${LAYER}
      ROWS: ${ROWS}
      CHUNK_SIZE: ${CHUNK_SIZE}
      WRITE_LOCAL: ${WRITE_LOCAL}
    entrypoint: ["/dbt/scripts/init.sh"]
    networks:
      - dbt_network

  # dbt: запускает модели один раз и завершается
  dbt:
    build:
      context: ./dbt
      dockerfile: Dockerfile
    container_name: dbt_runner
    depends_on:
      data-init:
        condition: service_completed_successfully
    environment:
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_DB: ${POSTGRES_DB}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET}
    volumes:
      - ./project:/dbt/project
    working_dir: /dbt/project
    entrypoint: ["/dbt/scripts/run_dbt.sh"]
    networks:
      - dbt_network

volumes:
  postgres_data:
  minio_data:

networks:
  dbt_network:
    driver: bridge