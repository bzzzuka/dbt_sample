services:

  starrocks:
    image: starrocks/allin1-ubuntu:3.4-latest
    container_name: starrocks
    hostname: starrocks
    restart: unless-stopped
    environment:
      - TZ=UTC
    ports:
      - "8030:8030"
      - "9030:9030"
      - "8040:8040"
    volumes:
      - starrocks_data:/data
    networks: [dbt_network]

  minio:
    image: ghcr.io/coollabsio/minio:latest
    container_name: dbt_minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 3s
      timeout: 3s
      retries: 20
    networks: [dbt_network]

  data-init:
    build: { context: ./dbt, dockerfile: Dockerfile }
    container_name: dbt_data_init
    depends_on:
      starrocks: { condition: service_started }
      minio: { condition: service_healthy }
    environment:
      STARROCKS_HOST: ${STARROCKS_HOST}
      STARROCKS_PORT: ${STARROCKS_PORT}
      STARROCKS_USER: ${STARROCKS_USER}
      STARROCKS_PASSWORD: ${STARROCKS_PASSWORD}
      STARROCKS_SCHEMA: ${STARROCKS_SCHEMA}
      STARROCKS_CATALOG: ${STARROCKS_CATALOG}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET}
      MINIO_REGION: ${MINIO_REGION}
      LAYER: ${LAYER}
      ROWS: ${ROWS}
      CHUNK_SIZE: ${CHUNK_SIZE}
      COLUMNS_PER_TABLE: ${COLUMNS_PER_TABLE}
      WRITE_LOCAL: ${WRITE_LOCAL}
    volumes:
      - ./project:/dbt/project
    entrypoint: ["/dbt/scripts/init.sh"]
    networks: [dbt_network]

  dbt:
    build: { context: ./dbt, dockerfile: Dockerfile }
    container_name: dbt_runner
    depends_on:
      data-init: { condition: service_completed_successfully }
    environment:
      STARROCKS_HOST: ${STARROCKS_HOST}
      STARROCKS_PORT: ${STARROCKS_PORT}
      STARROCKS_USER: ${STARROCKS_USER}
      STARROCKS_PASSWORD: ${STARROCKS_PASSWORD}
      STARROCKS_SCHEMA: ${STARROCKS_SCHEMA}
      STARROCKS_CATALOG: ${STARROCKS_CATALOG}
    volumes:
      - ./project:/dbt/project
    working_dir: /dbt/project
    entrypoint: ["/dbt/scripts/run_dbt.sh"]
    networks: [dbt_network]

  superset:
    build: { context: ./superset, dockerfile: Dockerfile }
    container_name: superset_app
    restart: unless-stopped
    depends_on:
      superset-init: { condition: service_completed_successfully }
      starrocks: { condition: service_started }
    environment:
      - SUPERSET_SECRET_KEY=${SUPERSET_SECRET_KEY}
    ports:
      - "8088:8088"
    volumes:
      - superset_home:/app/superset_home
    command: >
      gunicorn --bind 0.0.0.0:8088 --access-logfile - --error-logfile -
      --workers 1 --worker-class gthread --threads 20 --timeout 120
      --limit-request-line 0 --limit-request-field_size 0
      "superset.app:create_app()"
    networks: [dbt_network]

  superset-init:
    build: { context: ./superset, dockerfile: Dockerfile }
    container_name: superset_init
    depends_on:
      starrocks: { condition: service_started }
    environment:
      - SUPERSET_SECRET_KEY=${SUPERSET_SECRET_KEY}
      - STARROCKS_HOST=${STARROCKS_HOST}
      - STARROCKS_PORT=${STARROCKS_PORT}
      - STARROCKS_USER=${STARROCKS_USER}
      - STARROCKS_PASSWORD=${STARROCKS_PASSWORD}
      - STARROCKS_SCHEMA=${STARROCKS_SCHEMA}
      - STARROCKS_CATALOG=${STARROCKS_CATALOG}
    volumes:
      - superset_home:/app/superset_home
      - ./superset/init:/app/init
    command: ["/bin/bash", "/app/init/init-db.sh"]
    networks: [dbt_network]

  superset-worker:
    build: { context: ./superset, dockerfile: Dockerfile }
    container_name: superset_worker
    restart: unless-stopped
    depends_on:
      superset: { condition: service_started }
    environment:
      - SUPERSET_SECRET_KEY=${SUPERSET_SECRET_KEY}
    volumes:
      - superset_home:/app/superset_home
    command: >
      celery --app=superset.tasks.celery_app:app worker
      --pool=prefork -O fair -c 4
    networks: [dbt_network]

  postgres-airflow:
    image: postgres:15-alpine
    container_name: airflow_postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=airflow
      - POSTGRES_PASSWORD=airflow
      - POSTGRES_DB=airflow
    volumes:
      - postgres_airflow_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [dbt_network]

  redis:
    image: redis:7-alpine
    container_name: airflow_redis
    restart: unless-stopped
    expose: [6379]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 30s
      retries: 50
    networks: [dbt_network]

  airflow-init:
    build: { context: ./airflow, dockerfile: Dockerfile }
    image: dbt_sample-airflow:latest
    container_name: airflow_init
    depends_on:
      postgres-airflow: { condition: service_healthy }
      redis: { condition: service_healthy }
    environment:
      - AIRFLOW__CORE__EXECUTOR=CeleryExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:airflow@postgres-airflow/airflow
      - AIRFLOW__CELERY__RESULT_BACKEND=db+postgresql://airflow:airflow@postgres-airflow/airflow
      - AIRFLOW__CELERY__BROKER_URL=redis://redis:6379/0
      - AIRFLOW__CORE__FERNET_KEY=${AIRFLOW_FERNET_KEY}
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      - AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION=True
      - _AIRFLOW_DB_MIGRATE=true
      - _AIRFLOW_WWW_USER_CREATE=true
      - _AIRFLOW_WWW_USER_USERNAME=admin
      - _AIRFLOW_WWW_USER_PASSWORD=admin
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins
      - ./airflow/config:/opt/airflow/config
    command: version
    networks: [dbt_network]

  airflow-webserver:
    image: dbt_sample-airflow:latest
    container_name: airflow_webserver
    restart: unless-stopped
    depends_on:
      airflow-init: { condition: service_completed_successfully }
    environment:
      - AIRFLOW__CORE__EXECUTOR=CeleryExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:airflow@postgres-airflow/airflow
      - AIRFLOW__CELERY__RESULT_BACKEND=db+postgresql://airflow:airflow@postgres-airflow/airflow
      - AIRFLOW__CELERY__BROKER_URL=redis://redis:6379/0
      - AIRFLOW__CORE__FERNET_KEY=${AIRFLOW_FERNET_KEY}
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      - AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION=True
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins
      - ./airflow/config:/opt/airflow/config
      - ./dbt/scripts:/opt/airflow/dbt/scripts
      - ./dbt/profiles:/opt/airflow/dbt_profiles
      - ./project:/opt/airflow/dbt_project
    ports:
      - "8080:8080"
    command: webserver
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks: [dbt_network]

  airflow-scheduler:
    image: dbt_sample-airflow:latest
    container_name: airflow_scheduler
    restart: unless-stopped
    depends_on:
      airflow-init: { condition: service_completed_successfully }
    environment:
      - AIRFLOW__CORE__EXECUTOR=CeleryExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:airflow@postgres-airflow/airflow
      - AIRFLOW__CELERY__RESULT_BACKEND=db+postgresql://airflow:airflow@postgres-airflow/airflow
      - AIRFLOW__CELERY__BROKER_URL=redis://redis:6379/0
      - AIRFLOW__CORE__FERNET_KEY=${AIRFLOW_FERNET_KEY}
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      - AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION=True
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins
      - ./airflow/config:/opt/airflow/config
      - ./dbt/scripts:/opt/airflow/dbt/scripts
      - ./dbt/profiles:/opt/airflow/dbt_profiles
      - ./project:/opt/airflow/dbt_project
    command: scheduler
    networks: [dbt_network]

  airflow-worker:
    image: dbt_sample-airflow:latest
    container_name: airflow_worker
    restart: unless-stopped
    depends_on:
      airflow-init: { condition: service_completed_successfully }
    environment:
      - AIRFLOW__CORE__EXECUTOR=CeleryExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:airflow@postgres-airflow/airflow
      - AIRFLOW__CELERY__RESULT_BACKEND=db+postgresql://airflow:airflow@postgres-airflow/airflow
      - AIRFLOW__CELERY__BROKER_URL=redis://redis:6379/0
      - AIRFLOW__CORE__FERNET_KEY=${AIRFLOW_FERNET_KEY}
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      - AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION=True
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins
      - ./airflow/config:/opt/airflow/config
      - ./dbt/scripts:/opt/airflow/dbt/scripts
      - ./dbt/profiles:/opt/airflow/dbt_profiles
      - ./project:/opt/airflow/dbt_project
    command: celery worker
    healthcheck:
      test: ["CMD-SHELL", "celery inspect ping -d celery@$$HOSTNAME"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks: [dbt_network]

  airflow-triggerer:
    image: dbt_sample-airflow:latest
    container_name: airflow_triggerer
    restart: unless-stopped
    depends_on:
      airflow-init: { condition: service_completed_successfully }
    environment:
      - AIRFLOW__CORE__EXECUTOR=CeleryExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:airflow@postgres-airflow/airflow
      - AIRFLOW__CELERY__RESULT_BACKEND=db+postgresql://airflow:airflow@postgres-airflow/airflow
      - AIRFLOW__CELERY__BROKER_URL=redis://redis:6379/0
      - AIRFLOW__CORE__FERNET_KEY=${AIRFLOW_FERNET_KEY}
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      - AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION=True
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins
      - ./airflow/config:/opt/airflow/config
    command: triggerer
    networks: [dbt_network]

volumes:
  starrocks_data:
  minio_data:
  superset_home:
  postgres_airflow_data:

networks:
  dbt_network:
    driver: bridge