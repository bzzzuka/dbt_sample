services:

  starrocks:
    image: starrocks/allin1-ubuntu:3.4-latest
    container_name: starrocks
    hostname: starrocks
    restart: unless-stopped
    environment:
      - TZ=UTC
    ports:
      - "8030:8030"
      - "9030:9030"
      - "8040:8040"
    volumes:
      - starrocks_data:/data
    networks:
      - dbt_network

  minio:
    image: ghcr.io/coollabsio/minio:latest
    container_name: dbt_minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 3s
      timeout: 3s
      retries: 20
    networks:
      - dbt_network

  data-init:
    build:
      context: ./dbt
      dockerfile: Dockerfile
    container_name: dbt_data_init
    depends_on:
      starrocks:
        condition: service_started
      minio:
        condition: service_healthy
    environment:
      STARROCKS_HOST: ${STARROCKS_HOST}
      STARROCKS_PORT: ${STARROCKS_PORT}
      STARROCKS_USER: ${STARROCKS_USER}
      STARROCKS_PASSWORD: ${STARROCKS_PASSWORD}
      STARROCKS_SCHEMA: ${STARROCKS_SCHEMA}
      STARROCKS_CATALOG: ${STARROCKS_CATALOG}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET}
      MINIO_REGION: ${MINIO_REGION}
      LAYER: ${LAYER}
      ROWS: ${ROWS}
      CHUNK_SIZE: ${CHUNK_SIZE}
      COLUMNS_PER_TABLE: ${COLUMNS_PER_TABLE}
      WRITE_LOCAL: ${WRITE_LOCAL}
    volumes:
      - ./project:/dbt/project
    entrypoint: ["/dbt/scripts/init.sh"]
    networks:
      - dbt_network

  dbt:
    build:
      context: ./dbt
      dockerfile: Dockerfile
    container_name: dbt_runner
    depends_on:
      data-init:
        condition: service_completed_successfully
    environment:
      STARROCKS_HOST: ${STARROCKS_HOST}
      STARROCKS_PORT: ${STARROCKS_PORT}
      STARROCKS_USER: ${STARROCKS_USER}
      STARROCKS_PASSWORD: ${STARROCKS_PASSWORD}
      STARROCKS_SCHEMA: ${STARROCKS_SCHEMA}
      STARROCKS_CATALOG: ${STARROCKS_CATALOG}
    volumes:
      - ./project:/dbt/project
    working_dir: /dbt/project
    entrypoint: ["/dbt/scripts/run_dbt.sh"]
    networks:
      - dbt_network

volumes:
  starrocks_data:
  minio_data:

networks:
  dbt_network:
    driver: bridge